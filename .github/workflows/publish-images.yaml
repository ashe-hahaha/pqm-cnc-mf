name: Publish Docker images

on: push

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    concurrency:
      group: publish-dockerhub-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE_TAG: latest
      WEB_BIND: 127.0.0.1
    steps:
      - uses: actions/checkout@v4

      - name: Build both images
        run: |
          docker build -f pqm-cnc-frontend/Dockerfile -t "$DOCKERHUB_USERNAME/pqm-cnc-frontend:$IMAGE_TAG" .
          docker build -t "$DOCKERHUB_USERNAME/pqm-cnc-backend:$IMAGE_TAG" backend

      - name: Smoke test
        run: |
          docker compose up -d --pull never --wait --wait-timeout 90
          curl --retry 12 --retry-all-errors --retry-delay 2 --fail --silent --show-error http://127.0.0.1:3001/ -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3001/backend/api/hierarchy -o /dev/null

      - name: Compose logs
        if: failure()
        run: docker compose logs

      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish both images
        run: |
          docker push "$DOCKERHUB_USERNAME/pqm-cnc-frontend:$IMAGE_TAG"
          docker push "$DOCKERHUB_USERNAME/pqm-cnc-backend:$IMAGE_TAG"
