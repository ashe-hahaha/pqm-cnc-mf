[project]
name = "pqm-cnc-backend"
version = "0.1.0"
description = "PQM data API and datasource adapters"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic-settings>=2.5,<3", "websockets>=14,<17", "sqlalchemy>=2,<3", "aiokafka>=0.12,<1", "pillow>=11,<13"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
mysql = ["pymysql>=1.1,<2"]
clickhouse = ["clickhouse-connect>=0.9,<1"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
