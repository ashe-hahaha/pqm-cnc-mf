services:
  frontend:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/pqm-cnc-frontend:latest
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-3001}:3001"
    environment:
      - LLM_BASE_URL
      - STT_URL
    volumes:
      - machining-data:/app/pqm-cnc-frontend/data/MachiningData
      - balloon-layouts:/app/pqm-cnc-frontend/data/pqm
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  go2rtc:
    # Live CCTV for the Tool Wear page: restreams the NVR sub-stream to browsers (H.264 passthrough).
    # Internal only (no published port): the frontend reaches it at /cctv/ws. Set CCTV_RTSP_URL in .env.
    image: ghcr.io/alexxit/go2rtc:1.9.15
    environment:
      CCTV_RTSP_URL: ${CCTV_RTSP_URL:-}
    configs:
      - source: go2rtc_config
        target: /config/go2rtc.yaml
    restart: unless-stopped

  backend:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/pqm-cnc-backend:latest
    env_file:
      - path: ./backend.env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      MICROSCOPE_IMAGE_DIR: /app/data/microscope
    volumes:
      - microscope:/app/data/microscope
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

configs:
  go2rtc_config:
    content: |
      api:
        listen: ":1984"
        # The browser's Origin (the page address) differs from go2rtc's own host because the frontend proxies
        # the WebSocket, so go2rtc's same-origin check would reject it. go2rtc is not published; only /cctv/ws is reachable.
        origin: "*"
      rtsp:
        listen: ""
      webrtc:
        listen: ""
      streams:
        v61: $${CCTV_RTSP_URL}

volumes:
  machining-data:
  balloon-layouts:
  microscope:
